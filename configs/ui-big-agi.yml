version: '3.8'
services:
  big-agi:
    image: ghcr.io/enricoros/big-agi:latest
    container_name: big-agi
    ports:
      - '3002:3000'
    environment:
      - BIG_AGI_OLLAMA_API_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
