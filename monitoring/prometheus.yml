global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Ollama audit gateway runs on the host; reached via host-gateway.
  - job_name: 'ai-gateway'
    static_configs:
      - targets: ['host.docker.internal:11435']
